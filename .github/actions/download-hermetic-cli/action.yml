name: 'Download the hermetic CLI'
description: >-
  Repo-only helper for the reusable testing-conventions workflow: downloads the `hermetic-cli`
  artifact staged by the caller's `build-cli` job and marks the binary executable. Call it only
  behind `if: needs.detect.outputs.cli_command != ''` — see docs/internals/repo.md.

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: hermetic-cli
        path: hermetic-cli
    - shell: bash
      run: chmod +x ./hermetic-cli/testing-conventions
