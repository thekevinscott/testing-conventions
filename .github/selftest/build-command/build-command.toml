# Runtime fixture for the native-binding build hook as `[python].build_command`: `widget.py`
# imports `generated`, absent from the source tree, and this command produces it.
# `branch = false` because the fixture exercises the build hook, not branches.
[python]
coverage = { branch = false, fail_under = 100 }
build_command = "cp .github/selftest/build-command/generated.py.tmpl .github/selftest/build-command/generated.py"
reason = "stands in for a maturin/PyO3 native module a PEP 517 backend can't build via a pre-build shell hook"
