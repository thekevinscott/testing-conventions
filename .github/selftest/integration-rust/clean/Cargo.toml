# Clean self-test crate `gadget`: its integration test doubles nothing so `integration lint`
# passes, and its inline unit test covers every line so the unit suite clears the coverage
# floor. `[workspace]` keeps it standalone.
[package]
name = "gadget"
version = "0.0.0"
edition = "2021"
# `cargo package` ships `tests/` by default and the packaging gate rejects a shipped test file;
# the lint and coverage jobs read `tests/integration.rs` from the source tree, not the package.
exclude = ["tests/*"]

[workspace]
