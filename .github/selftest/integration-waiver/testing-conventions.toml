# Drives the integration-waiver self-test: the `[[python.exempt]]` entry lifts the
# `no-constant-patch` violation from a *non-default* config path, which the integration-lint
# job honors only when it forwards `--config` to the CLI.
[python]
coverage = { branch = true, fail_under = 100 }

[[python.exempt]]
path = "tests/integration/billing_test.py"
rules = ["no-constant-patch"]
reason = "legacy integration test patches a config constant; config-injection refactor tracked separately"
