name: Bootstrap npm packages (one-shot)

# One-shot helper to publish 0.0.0-bootstrap stubs for new npm package names, so trusted
# publishing has an existing package to bind to. See docs/internals/repo.md, "Bootstrapping
# a new npm package name".

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated list of npm package names to bootstrap'
        required: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: ">=11"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: packages/node/package.json
      - run: pnpm install --no-frozen-lockfile
      - name: Publish bootstrap stubs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGES: ${{ inputs.packages }}
        run: pnpm run bootstrap-npm
