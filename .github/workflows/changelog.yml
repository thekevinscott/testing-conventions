name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    # The job name is the check-run name branch protection references, so it stays as written
    # even though the gate now requires fragments rather than an edit to the two files. Renaming
    # it is a branch-protection change, which cannot land atomically with a PR.
    name: CHANGELOG + MIGRATIONS touched
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The gate diffs base...head, so it needs both commits, not a shallow tip.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      # The logic — which paths are package source, which are frozen stubs or fragments or tests,
      # and the raw-body `skip-changelog:` scan — lives in the colocated-tested `tc-checks
      # changelog-gate` command, per AGENTS.md "Logic lives in scripts, not workflow YAML". The
      # SHAs are CLI arguments, never an env side-channel.
      - name: Every changed package adds a changelog and a migration fragment
        run: >-
          uv run --project internals/checks tc-checks changelog-gate
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
