name: Check

# Runs `putitoutthere check` on every PR, so a release misconfiguration — a manifest
# repository-URL mismatch, bundle_cli wiring, a tag-template collision — fails here rather
# than mid-release.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: putitoutthere check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: thekevinscott/putitoutthere@v0
        with:
          command: check
