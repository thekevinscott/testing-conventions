name: Checks package (tests)

# Red/green tests for internals/checks. See docs/internals/repo.md, "The self-test
# assertions package".

on:
  pull_request:
  # A merge can break `main` even when both parents passed: two PRs that touch different lines
  # of one file merge without conflict, and each lane only ever tested its own stale base. No
  # paths filter here on purpose — main's health should be a known fact after every merge, not a
  # guess conditioned on what the last merge happened to touch.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Scope cancellation to PR pushes so the `push: [main]` run is never cancelled out from under
  # itself. A cancellation is a permanent fact of a sha's run history, so a cancelled main build
  # leaves that commit's verdict unknowable without a new sha.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: tc-checks — unit + e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Unit + e2e tests
        # The e2e tier reads this repo's workflow YAML and manifests, so a `paths:` filter
        # would skip the runs that break it.
        working-directory: internals/checks
        run: uv run pytest -v --import-mode=importlib
