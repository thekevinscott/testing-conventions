name: Code lines (tests)

# See docs/internals/repo.md, "The code-line counter's package".

on:
  pull_request:
    paths:
      - 'internals/code-lines/**'
      - '.github/workflows/code-lines-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: code_lines.py — unit + integration + e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Unit + integration + e2e tests
        working-directory: internals/code-lines
        run: uv run pytest -v --import-mode=importlib
