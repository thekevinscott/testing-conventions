name: Move major tag (tests)

# Red/green tests for internals/move-major-tag. See docs/internals/repo.md, "The
# move-major-tag helper's package".

on:
  pull_request:
    paths:
      - 'internals/move-major-tag/**'
      - '.github/workflows/move-major-tag-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: move_major_tag.py — integration + e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Unit + integration + e2e tests
        # pytest is a dev-dependency of internals/move-major-tag, pinned in its uv.lock.
        working-directory: internals/move-major-tag
        run: uv run pytest -v --import-mode=importlib
