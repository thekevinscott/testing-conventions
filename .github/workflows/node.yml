name: Node

on:
  pull_request:
    paths:
      - 'packages/node/**'
      - 'packages/rust/**'
      - '.github/workflows/node.yml'
  # A merge can break `main` even when both parents passed: two PRs that touch different lines
  # of one file merge without conflict, and each lane only ever tested its own stale base. No
  # paths filter here on purpose — main's health should be a known fact after every merge, not a
  # guess conditioned on what the last merge happened to touch.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Scope cancellation to PR pushes so the `push: [main]` run is never cancelled out from under
  # itself. A cancellation is a permanent fact of a sha's run history, so a cancelled main build
  # leaves that commit's verdict unknowable without a new sha.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v6
      # pnpm must be on PATH before setup-node's cache: setup-node runs `pnpm store path` to
      # resolve what to cache.
      - uses: pnpm/action-setup@v5
        with:
          version: ">=11"
      # cache-dependency-path names package.json because .gitignore excludes the packages'
      # pnpm-lock.yaml, so no lockfile exists for them in the checkout to hash.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/node/package.json
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: ">=11"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/node/package.json
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: ">=11"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/node/package.json
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test

  build:
    name: Build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust
      - uses: pnpm/action-setup@v5
        with:
          version: ">=11"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/node/package.json
      - name: Build rust binary
        run: cargo build --release
        working-directory: packages/rust
      - name: Build node package
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build
        working-directory: packages/node
      - name: Stage rust binary as platform optional dep
        run: |
          pkg=@testing-conventions/x86_64-unknown-linux-gnu
          target=packages/node/node_modules/$pkg
          mkdir -p "$target"
          printf '{"name":"%s","version":"0.0.1"}\n' "$pkg" > "$target/package.json"
          install -m 755 packages/rust/target/release/testing-conventions "$target/testing-conventions"
      - name: Smoke (--version via node wrapper -> rust binary)
        run: node packages/node/dist/bin/index.js --version
