name: Path length

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    # This job name is the check-run name branch protection references; renaming it is a
    # branch-protection change that cannot land atomically with a PR.
    name: Windows checkout path budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The gate diffs base...head, so it needs both commits rather than a shallow tip.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Every path this PR adds or renames fits a Windows checkout
        run: >-
          uv run --project internals/checks tc-checks path-length-gate
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
