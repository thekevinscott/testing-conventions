name: PR Monitor

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    name: 'CI Gate'
    runs-on: ubuntu-latest
    # The action has no timeout of its own, so this is the backstop: a predicted run that never
    # dispatches waits here until the job is killed.
    timeout-minutes: 20
    steps:
      - uses: thekevinscott/pr-monitor@v1
