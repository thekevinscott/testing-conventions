[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testing-conventions-github-checks"
version = "0"
description = "Repo-only self-test wiring and assertion checks for testing-conventions."
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.scripts]
# A single entry point for the whole suite — the click group in `checks/cli.py` that composes each
# check as a subcommand (`tc-checks build-command-wired`). Stays one line; new checks are registered
# in the group.
tc-checks = "checks.cli:main"

[dependency-groups]
# The CI test engines. rust.yml's integration job (a Rust crate, no uv project of its own)
# borrows this environment for them.
dev = ["coverage", "pytest", "cosmic-ray"]

[tool.hatch.build]
exclude = ["**/*_test.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/checks"]

[tool.pytest.ini_options]
# `src` layout: put it on the path so the checks and their colocated tests import the package
# normally (`from checks import ...`) — no per-file `sys.path.insert` hack.
pythonpath = ["src"]
