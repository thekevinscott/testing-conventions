[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testing-conventions-detect"
version = "0"
description = "Repo-only implementation of the `detect` composite action for testing-conventions (#363)."
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build]
exclude = ["**/*_test.py"]

[tool.hatch.build.targets.wheel]
# A single top-level module, not a package dir: map src/detect.py -> detect.py in the wheel.
include = ["src/detect.py"]

[tool.hatch.build.targets.wheel.sources]
src = ""

[tool.pytest.ini_options]
# `src` layout: on the path so detect.py and its tests import it as `import detect`.
pythonpath = ["src"]
