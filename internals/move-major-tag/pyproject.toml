[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The Move major tag workflow runs this as a plain script, so a runtime dependency here breaks it.
name = "testing-conventions-move-major-tag"
version = "0"
description = "Repo-only implementation of the move-major-tag helper for testing-conventions."
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build]
exclude = ["**/*_test.py"]

[tool.hatch.build.targets.wheel]
# Top-level modules, not a package dir: map src/<module>.py -> <module>.py.
include = ["src/*.py"]

[tool.hatch.build.targets.wheel.sources]
src = ""

[tool.pytest.ini_options]
# `src` layout: put it on the path so the modules and their colocated/integration/e2e tests
# import each other normally (`import move_major_tag`) — no per-file `sys.path.insert` hack.
pythonpath = ["src"]
