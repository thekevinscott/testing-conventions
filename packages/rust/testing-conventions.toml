# Exempt paths are relative to the crate root — the nearest ancestor holding `Cargo.toml` —
# so the same entry resolves whether the gate is pointed at the crate or at `src`.

[rust]
# Ratcheted down toward the shipped default of 1, one step per child of #750. This is the
# tightest value the crate passes — at 18 the gate fails. #750 records why the walk stops
# here, and the measurement behind it; measure again, rather than trusting any inventory
# recorded here or there.
one_function_per_file = { max_lines = 19 }

# The provisioning lock's test spawns two real threads and holds the critical section with a
# 50ms sleep: concurrency *is* the subject, so a double would prove nothing, and dropping the
# sleep narrows the race window until a lock-less implementation can pass by luck. Whole-file
# because line-scoped exemptions apply only to `coverage` and `mutation`.
[[rust.exempt]]
path = "src/mutation.rs"
rules = ["no-out-of-module-call", "no-out-of-module-import"]
reason = "the provisioning lock's unit test spawns real threads and sleeps inside the critical section — concurrency is the unit under test, so a double would assert nothing"
